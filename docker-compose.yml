version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_DATABASE: vvs
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    depends_on:
      - db
    environment:
      - FLASK_APP=pkg
      - FLASK_ENV=production
      - DATABASE_HOST=db
      - DATABASE_USER=root
      - DATABASE_PASS=
      - DATABASE_NAME=vvs
    ports:
      - "8080:8080"
    volumes:
      - .:/app

volumes:
  db_data:
