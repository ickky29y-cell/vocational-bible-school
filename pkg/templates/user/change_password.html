{% extends "base.html" %}
{% block title %}Set New Password - VBS Champions{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="vbs-card p-4 p-md-5 mx-auto" style="max-width:520px; border-top:6px solid var(--primary);">
        <div class="text-center mb-4">
            <i class="fas fa-lock" style="font-size:48px; color:var(--primary);"></i>
            <h2 class="fw-bold mt-3">Set a New Password</h2>
            <p class="text-muted">Your teacher reset your password. Set a private password before continuing.</p>
        </div>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <input class="form-control" type="password" name="password" id="password" minlength="6" required>
            </div>
            <div class="form-group mb-4">
                <label class="form-label" for="confirm_password">Confirm New Password</label>
                <input class="form-control" type="password" name="confirm_password" id="confirm_password" minlength="6" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Save New Password</button>
        </form>
    </div>
</div>
{% endblock %}
