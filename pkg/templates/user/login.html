{% extends "base.html" %}

{% block title %}Log In - VBS Champions{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="vbs-card p-4 p-md-5 mx-auto" style="max-width: 500px; border-top: 6px solid var(--primary);">
        <div class="text-center mb-4">
            <div style="font-size: 50px; color: var(--primary); margin-bottom: 10px;">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 class="fw-bold">Sign In</h2>
            <p class="text-muted">Enter your credentials to enter VBS Portal</p>
        </div>

        <form action="/user/login/" method="POST">
            <!-- CSRF Token helper if you decide to add standard Flask-WTF CSRF in the future -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
            
            <div class="form-group">
                <label class="form-label" for="identity">Username or Email</label>
                <input type="text" name="identity" id="identity" class="form-control" placeholder="Enter your VBS Username or Email" required autocomplete="username">
            </div>

            <div class="form-group mb-4">
                <label class="form-label" for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg py-3"><i class="fas fa-sign-in-alt"></i> Enter Portal</button>
        </form>
    </div>
</div>
{% endblock %}
