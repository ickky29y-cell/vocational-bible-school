{% extends "base.html" %}

{% block title %}Access Denied - VBS Champions{% endblock %}

{% block content %}
<div class="container text-center my-5 py-5">
    <div class="vbs-card p-5" style="max-width: 600px; margin: 0 auto; border-top: 5px solid var(--accent);">
        <div style="font-size: 80px; color: var(--accent); margin-bottom: 20px;">
            <i class="fas fa-lock"></i>
        </div>
        <h1 class="mb-3">Whoops! Area Locked</h1>
        <p class="lead text-muted mb-4">You do not have permission to access this page. Please make sure you are logged in with the correct role.</p>
        <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Go Back Home</a>
    </div>
</div>
{% endblock %}
